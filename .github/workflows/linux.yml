name: Linux AppImage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # used by release.yml

jobs:
  build:
    name: Build + test (Fedora 44, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          # Never bundle Cisco's OpenH264 binary (its patent grant only covers
          # copies users download from Cisco): build against the noopenh264 stub.
          dnf -y install --disablerepo='fedora-cisco-openh264*' noopenh264
          dnf -y install --disablerepo='fedora-cisco-openh264*' bash git cmake ninja-build gcc-c++ pkgconf-pkg-config \
            qt6-qtbase-devel qt6-qtmultimedia-devel qt6-qtwayland-devel qt6-qtbase-private-devel \
            libavcodec-free-devel libavformat-free-devel libavdevice-free-devel \
            libavutil-free-devel libswscale-free-devel libswresample-free-devel \
            pipewire-devel file curl findutils binutils patchelf desktop-file-utils rpm
      - uses: actions/checkout@v5
      - name: Configure
        run: scripts/ci-step.sh Configure cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: scripts/ci-step.sh Build cmake --build build
      - name: Unit and codec round-trip tests
        run: scripts/ci-step.sh Tests ctest --test-dir build --output-on-failure
      - name: Self-test (build tree)
        run: QT_QPA_PLATFORM=offscreen scripts/ci-step.sh Self-test build/src/bad-connection-studio --self-test
      - name: Build AppImage
        run: scripts/ci-step.sh AppImage packaging/linux/build-appimage.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/*

  clean-machine:
    # The AppImage must run where neither Qt nor FFmpeg is installed. Only
    # baseline desktop libraries that AppImages always take from the host
    # (GL/EGL, fontconfig, X11/xcb/SM, xkbcommon, fribidi, libpipewire) are present.
    name: Clean ${{ matrix.image }} (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, image: "fedora:44" }
          - { arch: x86_64, runner: ubuntu-24.04, image: "opensuse/tumbleweed" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, image: "fedora:44" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install bash and tar (minimal images)
        shell: sh
        run: command -v dnf >/dev/null && dnf -y install bash tar gzip || zypper -n install bash tar gzip
      - uses: actions/checkout@v5   # CI helper scripts only
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
      - name: Install host baseline libraries only
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install mesa-libGL mesa-libEGL libglvnd-opengl fontconfig freetype libX11 libxcb libxkbcommon libxkbcommon-x11 \
              xcb-util-cursor xcb-util-wm xcb-util-keysyms xcb-util-renderutil xcb-util-image glib2 dbus-libs pipewire-libs findutils libSM fribidi
          else
            zypper -n install Mesa-libGL1 Mesa-libEGL1 libglvnd fontconfig libfreetype6 libX11-6 libxcb1 libxkbcommon0 \
              libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-image0 \
              libglib-2_0-0 libdbus-1-3 libpipewire-0_3-0 findutils libSM6 libfribidi0
          fi
      - name: Verify Qt is NOT installed on the host
        run: |
          # Search the library directories directly (minimal images may lack ldconfig).
          # Qt must be absent. A host FFmpeg may exist (e.g. pulled in by
          # PipeWire plugins on Tumbleweed); the next step checks that the
          # AppImage loads its own copy anyway.
          find /usr /lib /lib64 /opt -xdev -name 'libavcodec.so*' 2>/dev/null | sed 's/^/note: host FFmpeg present: /' || true
          found="$(find /usr /lib /lib64 /opt -xdev -name 'libQt6Core.so*' 2>/dev/null || true)"
          if [ -n "$found" ]; then
            owners="$(for f in $found; do rpm -qf "$f" 2>/dev/null; done | sort -u | tr '\n' ' ')"
            echo "::error title=Host is not clean::$(echo "$found" | head -5 | tr '\n' ' ') -- from packages: $owners"
            exit 1
          fi
          echo "OK: no Qt or FFmpeg libraries on the host"
      - name: Report host libraries the AppImage cannot find
        run: |
          chmod +x BadConnectionStudio-*.AppImage
          ./BadConnectionStudio-*.AppImage --appimage-extract >/dev/null
          # The glibc loader itself lists dependencies (no ldd needed).
          loader=""
          for l in /lib64/ld-linux-x86-64.so.2 /lib/ld-linux-aarch64.so.1; do
            if [ -e "$l" ]; then loader="$l"; fi
          done
          export LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib"
          deps="$("$loader" --list squashfs-root/usr/bin/bad-connection-studio 2>&1 || true)"
          for f in squashfs-root/usr/lib/*.so* squashfs-root/usr/plugins/*/*.so; do
            [ -e "$f" ] || continue
            deps="$deps
          $("$loader" --list "$f" 2>&1 || true)"
          done
          # "lib => not found" (executable) or "...: cannot open shared object file" (library)
          missing="$(echo "$deps" | grep -E 'not found|cannot open shared object' | sed 's/.*error while loading shared libraries: //' | sort -u | tr -s ' \t' ' ' || true)"
          avcodec="$(echo "$deps" | grep -m1 'libavcodec' || true)"
          echo "libavcodec resolves to: $avcodec"
          if [ -n "$missing" ]; then
            echo "::error title=Missing host libraries::$(echo "$missing" | tr '\n' ';')"
            exit 1
          fi
          if ! echo "$avcodec" | grep -q squashfs-root; then
            echo "::error title=Wrong FFmpeg::the AppImage would load the host's FFmpeg: $avcodec"
            exit 1
          fi
          rm -rf squashfs-root
          echo "OK: every library resolves, bundled FFmpeg is used"
      - name: Self-test from the AppImage
        run: |
          chmod +x BadConnectionStudio-*.AppImage
          export QT_QPA_PLATFORM=offscreen
          # (bash steps run with pipefail, so a failure still fails the step)
          src/scripts/ci-step.sh "AppImage self-test" ./BadConnectionStudio-*.AppImage --appimage-extract-and-run --self-test | tee self-test.txt
          grep -q "Result: PASS" self-test.txt
          grep -q "v4l2loopback" self-test.txt   # missing driver is explained, not a crash
      - name: GUI smoke test (offscreen, generated test pattern)
        run: |
          export QT_QPA_PLATFORM=offscreen
          src/scripts/ci-step.sh "GUI smoke test" timeout 60 ./BadConnectionStudio-*.AppImage --appimage-extract-and-run --screenshot gui.png
          test -s gui.png
      - uses: actions/upload-artifact@v4
        with:
          name: clean-test-${{ matrix.arch }}-${{ strategy.job-index }}
          path: |
            self-test.txt
            gui.png
