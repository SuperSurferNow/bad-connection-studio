name: macOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # used by release.yml

jobs:
  build:
    name: Build + test (macOS, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      FFMPEG_PREFIX: ${{ github.workspace }}/ffmpeg-prefix
      QT_VERSION: "6.8.3"
    steps:
      - uses: actions/checkout@v5
      - name: Build tools
        run: brew install nasm ninja pkgconf
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          # No cache: a later step removes Qt's FFmpeg plugin, and a cached
          # copy without it would break the next Configure.
          cache: false
      - name: Restore FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-prefix
          key: ffmpeg-macos-${{ matrix.arch }}-${{ hashFiles('scripts/build-ffmpeg-macos.sh') }}
      - name: Build FFmpeg (macOS 13+, x264/libvpx/opus)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/ci-step.sh FFmpeg scripts/build-ffmpeg-macos.sh "$FFMPEG_PREFIX"
      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$FFMPEG_PREFIX/lib/pkgconfig"
          scripts/ci-step.sh Configure cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage"
      - name: Remove Qt's own FFmpeg
        run: |
          # Qt Multimedia ships an FFmpeg plugin with its own FFmpeg 7.1, whose
          # dylibs have the same names as ours (libavcodec.61.dylib, ...);
          # macdeployqt would put whichever it copies last into the bundle.
          # The app uses Qt Multimedia only for audio, through Qt's native
          # Darwin backend, so the plugin is not needed. Removed only after
          # Configure: Qt's CMake package files expect it to exist.
          ls "$QT_ROOT_DIR"/lib/libav*.dylib "$QT_ROOT_DIR"/lib/libsw*.dylib 2>/dev/null || true
          rm -f "$QT_ROOT_DIR"/plugins/multimedia/libffmpegmediaplugin.dylib
          rm -f "$QT_ROOT_DIR"/lib/libav*.dylib "$QT_ROOT_DIR"/lib/libsw*.dylib "$QT_ROOT_DIR"/lib/libpostproc*.dylib
      - name: Build
        run: scripts/ci-step.sh Build cmake --build build
      - name: Unit and codec round-trip tests
        run: scripts/ci-step.sh Tests ctest --test-dir build --output-on-failure
      - name: Bundle (macdeployqt) + license report
        run: |
          scripts/ci-step.sh Install cmake --install build
          app=stage/BadConnectionStudio.app
          scripts/license-report-macos.sh "$app" > build/LICENSE-REPORT.txt
          cp build/LICENSE-REPORT.txt "$app/Contents/Resources/doc/"
          cat build/LICENSE-REPORT.txt
          # Nothing may still point outside the bundle (would fail on users' Macs).
          leaks="$(find "$app" -type f \( -name '*.dylib' -o -perm -u+x \) -exec otool -L {} \; 2>/dev/null \
                   | grep -E "$FFMPEG_PREFIX|/opt/homebrew|/usr/local/|$RUNNER_WORKSPACE" || true)"
          if [ -n "$leaks" ]; then echo "::error title=Bundle not self-contained::$leaks" | head -20; exit 1; fi
          # The bundled FFmpeg must be ours (with x264), not another copy.
          if ! strings "$app"/Contents/Frameworks/libavcodec.*.dylib | grep -q -- '--enable-libx264'; then
            echo "::error title=Wrong FFmpeg bundled::libavcodec in the bundle is not scripts/build-ffmpeg-macos.sh's build"
            exit 1
          fi
      - name: Ad-hoc sign
        run: |
          # No Apple developer account: an ad-hoc signature is enough for Apple
          # Silicon to run the binaries; Gatekeeper asks the user once.
          codesign --force --deep --sign - stage/BadConnectionStudio.app
          codesign --verify --deep --strict stage/BadConnectionStudio.app
      - name: Self-test (bundle)
        run: |
          QT_QPA_PLATFORM=offscreen stage/BadConnectionStudio.app/Contents/MacOS/BadConnectionStudio --self-test \
            | tee self-test.txt
          grep -q "window" self-test.txt
      - name: Build DMG
        run: |
          mkdir dmg
          cp -R stage/BadConnectionStudio.app dmg/
          ln -s /Applications dmg/Applications
          cp docs/MACOS_SETUP.md dmg/"Read me first (setup).md"
          hdiutil create -volname "Bad Connection Studio" -srcfolder dmg -fs HFS+ -format UDZO \
            "BadConnectionStudio-macos-${{ matrix.arch }}.dmg"
          cp build/LICENSE-REPORT.txt "BadConnectionStudio-macos-${{ matrix.arch }}.LICENSE-REPORT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            BadConnectionStudio-macos-*.dmg
            BadConnectionStudio-macos-*.LICENSE-REPORT.txt

  clean-machine:
    # A fresh runner without Qt or the FFmpeg build: the app in the DMG must
    # bring everything it needs.
    name: Clean machine (macOS, ${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
      - name: Install from DMG and self-test
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/bcs BadConnectionStudio-macos-*.dmg
          cp -R /tmp/bcs/BadConnectionStudio.app "$RUNNER_TEMP/"
          hdiutil detach /tmp/bcs
          # Hide anything a stray Homebrew might provide.
          export DYLD_FALLBACK_LIBRARY_PATH=/usr/lib
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/BadConnectionStudio.app/Contents/MacOS/BadConnectionStudio" \
            --self-test | tee self-test.txt
