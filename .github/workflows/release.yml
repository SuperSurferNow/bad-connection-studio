name: Release

# Builds every package and attaches it to a GitHub Release. Start it either by
#  - pushing a tag:   git tag v0.2.0 && git push origin v0.2.0
#  - or on github.com: Releases > Draft a new release > new tag v0.2.0 > Publish
#    (the binaries are attached to that release when the builds finish).
on:
  push:
    tags: ["v*"]

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
  windows:
    uses: ./.github/workflows/windows.yml
    secrets: inherit
  macos:
    uses: ./.github/workflows/macos.yml

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        run: |
          # Version-less names, so README links to releases/latest/download/<name>
          # always point at the newest build.
          set -euo pipefail
          mkdir -p assets
          for arch in x86_64 aarch64; do
            cp artifacts/appimage-$arch/BadConnectionStudio-*-$arch.AppImage \
               assets/BadConnectionStudio-linux-$arch.AppImage
            cp artifacts/appimage-$arch/BadConnectionStudio-*-$arch.LICENSE-REPORT.txt \
               assets/BadConnectionStudio-linux-$arch.LICENSE-REPORT.txt
          done
          cp artifacts/windows-installer/build/BadConnectionStudio-*-windows-x64-setup.exe \
             assets/BadConnectionStudio-windows-x64-setup.exe
          cp artifacts/windows-installer/stage/share/doc/BadConnectionStudio/LICENSE-REPORT.txt \
             assets/BadConnectionStudio-windows-x64.LICENSE-REPORT.txt
          cp artifacts/windows-virtual-camera-component/BadConnectionStudio-VirtualCamera-windows-setup.exe assets/
          for arch in arm64 x86_64; do
            cp artifacts/macos-$arch/BadConnectionStudio-macos-$arch.dmg assets/
            cp artifacts/macos-$arch/BadConnectionStudio-macos-$arch.LICENSE-REPORT.txt assets/
          done
          (cd assets && sha256sum * > SHA256SUMS.txt)
          ls -la assets
      - name: Create release (or add assets to the one created on github.com)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
            # Keep a description the author wrote; fill it only if empty.
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file packaging/RELEASE_NOTES.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" assets/* \
              --title "Bad Connection Studio $GITHUB_REF_NAME" \
              --notes-file packaging/RELEASE_NOTES.md
          fi
