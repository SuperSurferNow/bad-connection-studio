name: Release

# Builds every package and attaches it to a GitHub Release. Start it either by
#  - pushing a tag:   git tag v0.1.0 && git push origin v0.1.0
#  - or on github.com: Releases > Draft a new release > new tag v0.1.0 > Publish
#    (the binaries are attached to that release when the builds finish).
on:
  push:
    tags: ["v*"]

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
  windows:
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        run: |
          mkdir -p assets
          find artifacts/appimage-* -type f -exec cp {} assets/ \;
          cp artifacts/windows-installer/build/BadConnectionStudio-*-setup.exe assets/
          cp artifacts/windows-installer/stage/share/doc/BadConnectionStudio/LICENSE-REPORT.txt \
             assets/BadConnectionStudio-windows-x64.LICENSE-REPORT.txt
          if [ -d artifacts/windows-virtual-camera-component ]; then
            cp artifacts/windows-virtual-camera-component/*.exe assets/
          fi
          (cd assets && sha256sum * > SHA256SUMS.txt)
          ls -la assets
      - name: Create release (or add assets to the one created on github.com)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
            # Keep a description the author wrote; fill it only if empty.
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file packaging/RELEASE_NOTES.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" assets/* \
              --title "Bad Connection Studio $GITHUB_REF_NAME" \
              --notes-file packaging/RELEASE_NOTES.md
          fi
